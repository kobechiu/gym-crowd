name: 收集健身房人數

on:
  # 主要觸發：外部排程服務（cron-job.org）每 10 分鐘呼叫 GitHub API 觸發這個 workflow。
  # GitHub 內建排程實測平均 6～7 小時才跑一次，只留作每小時一次的備援。
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取各場館人數
        run: python collector/collect.py
      - name: 存回 repo
        run: |
          git config user.name "gym-crowd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase --quiet
          git push
